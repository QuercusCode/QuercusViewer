<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting to Quercus Viewer...</title>
    <meta http-equiv="refresh" content="0; url=https://quercusviewer.com">
    <script type="text/javascript">
        // If someone hits a nested route on the old domain, forward it to the new one
        var path = window.location.pathname.replace('/QuercusViewer', '');
        var newUrl = 'https://quercusviewer.com' + path + window.location.search + window.location.hash;
        window.location.replace(newUrl);
    </script>
</head>

<body>
    <p>Redirecting to the new domain: <a href="https://quercusviewer.com">quercusviewer.com</a></p>
</body>

</html>
